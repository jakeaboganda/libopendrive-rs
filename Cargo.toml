[package]
name = "libopendrive"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Pure-Rust OpenDRIVE (.xodr) importer: bakes a road network into polylines, a lane graph, and a surface mesh."
repository = "https://github.com/jakeaboganda/libopendrive-rs"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["opendrive", "xodr", "road", "map", "simulation"]
categories = ["parser-implementations", "science::robotics", "simulation"]
documentation = "https://docs.rs/libopendrive"
# The tests and benchmarks need the map fixtures in tests/data. Those stay in
# git and out of the published tarball. They are 1.7 MB, consumers never need
# them, and two carry third-party licences (see tests/data/README.md). Tests
# shipped without their data could only fail, so the tests go too. Run them
# from a git checkout.
exclude = [
    "/.github",
    "/.gitignore",
    "/benches",
    "/rust-toolchain.toml",
    "/tests",
]

[features]
# Serialize the baked network and its surface mesh, for shipping a map to a
# viewer or another process, or caching an import.
serde = ["dep:serde"]

[dependencies]
roxmltree = "0.21"
serde = { version = "1", features = ["derive"], optional = true }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[profile.bench]
debug = true

[[bench]]
name = "import"
harness = false

[[bench]]
name = "query"
harness = false

[package.metadata.docs.rs]
all-features = true
