[package]
name = "libopendrive"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Pure-Rust OpenDRIVE (.xodr) importer: bakes a road network into polylines, a lane graph, and a surface mesh."
repository = "https://github.com/jakeaboganda/libopendrive-rs"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["opendrive", "xodr", "road", "map", "simulation"]
categories = ["parser-implementations", "science::robotics", "simulation"]
# Map fixtures stay in git and out of the published tarball: consumers never
# need them, they are 1.7 MB, and they carry third-party licences of their own
# (see tests/data/README.md). Run the integration tests from a git checkout.
exclude = ["/tests/data"]

[dependencies]
glam = "0.32"
roxmltree = "0.21"
thiserror = "2"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[profile.bench]
debug = true

[[bench]]
name = "import"
harness = false

[[bench]]
name = "query"
harness = false
