<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>libopendrive viewer</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font: 13px/1.4 system-ui, sans-serif; background: #12151a; color: #d8dee9; }
  #app { display: grid; grid-template-columns: 300px 1fr; height: 100%; }
  #sidebar { border-right: 1px solid #2a2f3a; display: flex; flex-direction: column; min-height: 0; }
  #sidebar header { padding: 10px 12px; border-bottom: 1px solid #2a2f3a; }
  #sidebar h1 { font-size: 14px; margin: 0 0 8px; font-weight: 600; }
  #search { width: 100%; padding: 6px 8px; background: #1b1f27; border: 1px solid #2a2f3a; border-radius: 5px; color: inherit; }
  #count { color: #7c8595; font-size: 11px; margin-top: 6px; }
  #list { overflow: auto; flex: 1; padding: 4px 0; }
  .road { padding: 4px 12px 2px; color: #8fa1b3; font-weight: 600; letter-spacing: .02em; }
  .lane { padding: 3px 12px 3px 22px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
  .lane:hover { background: #1b1f27; }
  .lane.active { background: #2d4a63; }
  .lane .tag { color: #7c8595; font-variant-numeric: tabular-nums; }
  #view { position: relative; min-width: 0; }
  canvas { display: block; }
  #tip { position: absolute; pointer-events: none; padding: 6px 8px; background: #0b0d11ee; border: 1px solid #3a4150;
          border-radius: 5px; font-variant-numeric: tabular-nums; white-space: pre; display: none; z-index: 5; }
  #tip b { color: #8ec07c; }
  #hint { position: absolute; left: 12px; bottom: 10px; color: #6b7280; font-size: 11px; }
  #tools { position: absolute; left: 12px; top: 12px; z-index: 6; display: flex; gap: 10px; flex-wrap: wrap; max-width: 60%;
           background: #0b0d11cc; border: 1px solid #2a2f3a; border-radius: 6px; padding: 6px 8px; align-items: center; }
  #legend { padding: 8px 12px; border-top: 1px solid #2a2f3a; display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11px; color: #8fa1b3; }
  #legend span { display: flex; align-items: center; gap: 4px; }
  .swatch { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
  #tools label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  #tools select { background: #1b1f27; color: inherit; border: 1px solid #2a2f3a; border-radius: 4px; padding: 2px 4px; }
  #flagcount { color: #e88; font-variant-numeric: tabular-nums; }
  #err { position: absolute; inset: 0; display: none; place-content: center; text-align: center; padding: 40px; color: #e88; }
  #err code { color: #d8dee9; background: #1b1f27; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <header>
      <h1>Roads &amp; lanes</h1>
      <input id="search" placeholder="filter: road id, lane id, or lane type…" autocomplete="off" />
      <div id="count"></div>
    </header>
    <div id="list"></div>
    <div id="legend"></div>
  </aside>
  <div id="view">
    <div id="tip"></div>
    <div id="tools">
      <label>view
        <select id="mode">
          <option value="solid">solid</option>
          <option value="wire">wireframe</option>
          <option value="both">solid + wireframe</option>
        </select>
      </label>
      <label><input type="checkbox" id="centerlines"> centerlines</label>
      <label><input type="checkbox" id="boundaries"> boundaries</label>
      <label><input type="checkbox" id="normals"> normals</label>
      <label><input type="checkbox" id="flag"> flag bad tris <span id="flagcount"></span></label>
    </div>
    <div id="hint">drag: orbit · scroll: zoom · right-drag: pan · [w] cycles wireframe · [n] toggles normals · hover a lane for coordinates</div>
    <div id="err"></div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const SCENE_URL = new URLSearchParams(location.search).get('scene') || 'scene.json';

const view = document.getElementById('view');
const tip = document.getElementById('tip');
const listEl = document.getElementById('list');
const countEl = document.getElementById('count');
const searchEl = document.getElementById('search');

// Surface colour per lane type, keyed by the crate's `LaneType::as_str`.
// Carriageway types stay in cool greys so the road still reads as a road;
// everything a vehicle has no business on is warm or light enough to pick out
// at a glance. A type with no entry here falls back to FALLBACK_COLOR, which
// is how a lane type added to the crate but not to this table shows up as
// unclassified rather than as a driving lane.
const LANE_COLORS = {
  'none': 0x4a4d55, 'driving': 0x5a6b82, 'bidirectional': 0x7a5a82, 'bus': 0x2f6f4f, 'taxi': 0x8a7a2f,
  'hov': 0x3f6f8a, 'entry': 0x4f7a5a, 'exit': 0x7a5a4f, 'on-ramp': 0x46748c,
  'off-ramp': 0x8c7446, 'connecting-ramp': 0x5f7f8f, 'slip-lane': 0x6a5a7a,
  'parking': 0x3f5a99, 'stop': 0x8a3f3f, 'restricted': 0x7a4a4a, 'biking': 0x2f7a6f,
  'sidewalk': 0x9aa3ad, 'shoulder': 0x6f6a5f, 'border': 0x5f5f5f, 'curb': 0xa8a29a,
  'median': 0x4f6b4f, 'road-works': 0x9a6a2f, 'tram': 0x6a6a8a, 'rail': 0x7a7a7a,
};
const FALLBACK_COLOR = 0xc026d3;

// Length in metres of a drawn normal hair. Road scale, so it reads against a
// lane without burying it.
const NORMAL_LENGTH = 0.6;

let scene, camera, renderer, controls, raycaster;
let roadMesh, wireMesh, badMesh, highlight, highlightLine;
let centerlineMesh, boundaryMesh, normalMesh;
let lanes = [];              // enriched lane records
let spanIndex = [];          // {start,end,lane} sorted by index-range start, for picking
let laneById = new Map();
let activeLane = null;

init().catch(showError);

async function init() {
  let data;
  try {
    data = await (await fetch(SCENE_URL)).json();
  } catch (e) {
    throw new Error(`could not load ${SCENE_URL} — serve this folder over HTTP ` +
      `(e.g. <code>python3 -m http.server</code>) rather than opening the file directly.`);
  }

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x12151a);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(devicePixelRatio);
  view.appendChild(renderer.domElement);

  // OpenDRIVE is Z-up; keep the world in its own frame and point the camera's
  // up at +Z rather than rotating every coordinate.
  THREE.Object3D.DEFAULT_UP.set(0, 0, 1);
  camera = new THREE.PerspectiveCamera(55, 1, 0.5, 20000);
  camera.up.set(0, 0, 1);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x1a1d22, 1.1));
  const sun = new THREE.DirectionalLight(0xffffff, 1.4);
  sun.position.set(0.4, 0.7, 1);
  scene.add(sun);

  buildMesh(data);
  buildLanes(data);
  buildOverlays(data);
  buildSidebar();
  buildLegend();
  frameOn(roadMesh);

  applyMode();
  for (const id of ['mode', 'flag', 'centerlines', 'boundaries', 'normals']) {
    document.getElementById(id).addEventListener('change', applyMode);
  }

  raycaster = new THREE.Raycaster();
  renderer.domElement.addEventListener('pointermove', onHover);
  renderer.domElement.addEventListener('pointerleave', () => hideTip());
  searchEl.addEventListener('input', renderSidebar);
  addEventListener('keydown', e => {
    if (document.activeElement === searchEl) return;
    if (e.key === 'w') {
      const sel = document.getElementById('mode');
      const order = ['solid', 'wire', 'both'];
      sel.value = order[(order.indexOf(sel.value) + 1) % order.length];
      applyMode();
    } else if (e.key === 'n') {
      const box = document.getElementById('normals');
      box.checked = !box.checked;
      applyMode();
    }
  });

  addEventListener('resize', resize);
  resize();
  animate();
}

function buildMesh(data) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(data.mesh.positions, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(data.mesh.normals, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(laneTypeColors(data), 3));
  g.setIndex(new THREE.Uint32BufferAttribute(data.mesh.indices, 1));
  g.computeBoundingBox();
  g.computeBoundingSphere();

  roadMesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    vertexColors: true, roughness: 0.95, metalness: 0.0,
    side: THREE.DoubleSide, flatShading: false,
  }));
  scene.add(roadMesh);

  // Wireframe overlay: every triangle edge, so slivers, folds, and t-junctions
  // between lanes are visible. Hidden until the view mode asks for it.
  wireMesh = new THREE.LineSegments(
    new THREE.WireframeGeometry(g),
    new THREE.LineBasicMaterial({ color: 0x39d0ff }));
  wireMesh.visible = false;
  scene.add(wireMesh);

  // Diagnostic: the triangles whose geometric normal faces down (inverted /
  // folded) or is ~zero (degenerate sliver), pulled into their own mesh and
  // drawn on top (depthTest off) so none hide inside the surface.
  badMesh = buildBadMesh(data.mesh);
  scene.add(badMesh);

  // A yellow overlay drawn over the base mesh for the hovered lane section,
  // sharing the base position buffer and swapping only its index slice.
  const hg = new THREE.BufferGeometry();
  hg.setAttribute('position', g.getAttribute('position'));
  highlight = new THREE.Mesh(hg, new THREE.MeshBasicMaterial({
    color: 0xffd24a, transparent: true, opacity: 0.55, side: THREE.DoubleSide,
    depthTest: true, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2,
  }));
  highlight.renderOrder = 2;
  highlight.visible = false;
  scene.add(highlight);

  highlightLine = new THREE.Line(new THREE.BufferGeometry(),
    new THREE.LineBasicMaterial({ color: 0xffef9f }));
  highlightLine.renderOrder = 3;
  highlightLine.visible = false;
  scene.add(highlightLine);

  // Ground grid for orientation, sized to the map.
  const bb = g.boundingBox, span = Math.max(bb.max.x - bb.min.x, bb.max.y - bb.min.y);
  const grid = new THREE.GridHelper(Math.ceil(span * 1.2), 40, 0x2a2f3a, 0x20242c);
  grid.rotation.x = Math.PI / 2;                       // grid is XZ by default; lay it in XY
  grid.position.set((bb.min.x + bb.max.x) / 2, (bb.min.y + bb.max.y) / 2, bb.min.z - 0.05);
  scene.add(grid);
}

// A colour per mesh vertex, taken from the lane type of the span that owns it.
// One buffer beats one material per type: the mesh stays a single draw call,
// and a sidewalk is still visibly not a carriageway.
function laneTypeColors(data) {
  const count = data.mesh.positions.length / 3;
  const out = new Float32Array(count * 3);
  const c = new THREE.Color();
  for (const lane of data.lanes) {
    // setHex reads sRGB and stores the renderer's working space, so the buffer
    // matches what a material colour of the same hex would have produced.
    c.setHex(LANE_COLORS[lane.laneType] ?? FALLBACK_COLOR);
    for (let v = lane.vertexRange[0]; v < lane.vertexRange[1]; v++) {
      out[v * 3] = c.r; out[v * 3 + 1] = c.g; out[v * 3 + 2] = c.b;
    }
  }
  return out;
}

// The three line overlays, each one geometry for the whole map so a toggle is
// a single `visible` flip rather than a rebuild.
//
// Centerlines come from the exported lane table. Boundaries do not need to be
// exported at all: a lane's mesh vertices alternate left rib and right rib, so
// the even ones are its left edge and the odd ones its right. Normals are a
// hair per mesh vertex, drawn along the baked up-normal.
function buildOverlays(data) {
  const p = data.mesh.positions, nrm = data.mesh.normals;
  const centers = [], edges = [], hairs = [];

  for (const lane of data.lanes) {
    const pts = lane.centerline;
    for (let i = 0; i + 1 < pts.length; i++) {
      // Lifted clear of the surface it lies on, or it z-fights with it.
      centers.push(pts[i][0], pts[i][1], pts[i][2] + 0.05,
                   pts[i + 1][0], pts[i + 1][1], pts[i + 1][2] + 0.05);
    }
    for (let side = 0; side < 2; side++) {
      for (let v = lane.vertexRange[0] + side; v + 2 < lane.vertexRange[1]; v += 2) {
        const a = v * 3, b = (v + 2) * 3;
        edges.push(p[a], p[a + 1], p[a + 2] + 0.03, p[b], p[b + 1], p[b + 2] + 0.03);
      }
    }
  }
  for (let v = 0; v * 3 < p.length; v++) {
    const i = v * 3;
    hairs.push(p[i], p[i + 1], p[i + 2],
               p[i] + nrm[i] * NORMAL_LENGTH,
               p[i + 1] + nrm[i + 1] * NORMAL_LENGTH,
               p[i + 2] + nrm[i + 2] * NORMAL_LENGTH);
  }

  centerlineMesh = lineOverlay(centers, 0x8ec07c);
  boundaryMesh = lineOverlay(edges, 0xe6d5a8);
  normalMesh = lineOverlay(hairs, 0xff7ad9);
}

function lineOverlay(positions, color) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  const line = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color }));
  line.visible = false;
  line.renderOrder = 1;
  scene.add(line);
  return line;
}

// Collect the triangles a road surface should never contain: inverted (normal
// faces down) or degenerate (near-zero area). Returned as a standalone mesh
// drawn over everything, so a lingering fold is impossible to miss.
function buildBadMesh(mesh) {
  const p = mesh.positions, ix = mesh.indices;
  const pos = [];
  for (let t = 0; t < ix.length; t += 3) {
    const a = ix[t] * 3, b = ix[t + 1] * 3, c = ix[t + 2] * 3;
    const ux = p[b] - p[a], uy = p[b + 1] - p[a + 1], uz = p[b + 2] - p[a + 2];
    const vx = p[c] - p[a], vy = p[c + 1] - p[a + 1], vz = p[c + 2] - p[a + 2];
    const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    const len = Math.hypot(nx, ny, nz);
    const z = len > 0 ? nz / len : 0;
    if (z > 1e-4) continue;                 // healthy, up-facing
    for (const v of [a, b, c]) pos.push(p[v], p[v + 1], p[v + 2]);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({
    color: 0xff2d55, side: THREE.DoubleSide, depthTest: false, transparent: true, opacity: 0.9,
  }));
  m.renderOrder = 5;
  m.visible = false;
  m.userData.count = pos.length / 9;
  return m;
}

// Apply the current view controls to the road, wireframe, overlay and
// diagnostic meshes.
function applyMode() {
  const on = id => document.getElementById(id).checked;
  const mode = document.getElementById('mode').value;
  roadMesh.visible = mode !== 'wire';
  wireMesh.visible = mode !== 'solid';
  centerlineMesh.visible = on('centerlines');
  boundaryMesh.visible = on('boundaries');
  normalMesh.visible = on('normals');
  badMesh.visible = on('flag');
  const n = badMesh.userData.count;
  document.getElementById('flagcount').textContent = on('flag') ? `(${n})` : '';
}

function buildLanes(data) {
  const indices = data.mesh.indices;
  lanes = data.lanes.map(l => {
    // Precompute cumulative 3D arc length so cursor projection matches the
    // crate's Polyline::project (nearest by 3D distance, s in 3D, t in XY).
    const pts = l.centerline;
    const cum = new Float32Array(pts.length);
    for (let i = 1; i < pts.length; i++) cum[i] = cum[i - 1] + dist3(pts[i - 1], pts[i]);
    return { ...l, cum, sliceIndices: indices.slice(l.indexRange[0], l.indexRange[1]) };
  });
  laneById = new Map(lanes.map(l => [l.laneId, l]));
  spanIndex = lanes
    .map(l => ({ start: l.indexRange[0], end: l.indexRange[1], lane: l }))
    .sort((a, b) => a.start - b.start);
}

// --- Sidebar -----------------------------------------------------------------

function buildSidebar() { renderSidebar(); }

// Swatches for the lane types this map actually contains, so the legend names
// what is on screen rather than every type the crate knows about.
function buildLegend() {
  const present = [...new Set(lanes.map(l => l.laneType))].sort();
  const frag = document.createDocumentFragment();
  for (const type of present) {
    const hex = (LANE_COLORS[type] ?? FALLBACK_COLOR).toString(16).padStart(6, '0');
    const el = document.createElement('span');
    el.innerHTML = `<i class="swatch" style="background:#${hex}"></i>${type}`;
    frag.appendChild(el);
  }
  document.getElementById('legend').replaceChildren(frag);
}

function renderSidebar() {
  const q = searchEl.value.trim().toLowerCase();
  const match = l =>
    !q || String(l.roadId).toLowerCase().includes(q) ||
    String(l.odLaneId).includes(q) || String(l.laneId).includes(q) ||
    l.laneType.includes(q);

  const byRoad = new Map();
  let shown = 0;
  for (const l of lanes) {
    if (!match(l)) continue;
    shown++;
    if (!byRoad.has(l.roadId)) byRoad.set(l.roadId, []);
    byRoad.get(l.roadId).push(l);
  }
  countEl.textContent = `${shown} / ${lanes.length} lanes · ${byRoad.size} roads`;

  const frag = document.createDocumentFragment();
  for (const [road, group] of byRoad) {
    const r = document.createElement('div');
    r.className = 'road';
    r.textContent = `road ${road}`;
    frag.appendChild(r);
    group.sort((a, b) => a.section - b.section || b.odLaneId - a.odLaneId);
    for (const l of group) {
      const el = document.createElement('div');
      el.className = 'lane' + (activeLane === l.laneId ? ' active' : '');
      el.innerHTML = `<span>lane ${l.odLaneId} <span class="tag">§${l.section} ${l.laneType}</span></span>` +
        `<span class="tag">${l.length.toFixed(0)} m</span>`;
      el.onclick = () => { selectLane(l.laneId); frameOnLane(l); };
      frag.appendChild(el);
    }
  }
  listEl.replaceChildren(frag);
}

// --- Hover / picking ---------------------------------------------------------

function onHover(ev) {
  const rect = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(
    ((ev.clientX - rect.left) / rect.width) * 2 - 1,
    -((ev.clientY - rect.top) / rect.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObject(roadMesh, false)[0];
  if (!hit) { hideTip(); if (!activeLane) clearHighlight(); return; }

  const lane = laneForFace(hit.faceIndex);
  if (!lane) { hideTip(); return; }

  const { s, t, heading } = project(lane, hit.point);
  if (activeLane == null) setHighlight(lane);

  const p = hit.point;
  const rows = [
    `<b>road ${lane.roadId}</b>  lane ${lane.odLaneId}  <b>${lane.laneType}</b>`,
    `x ${p.x.toFixed(2)}   y ${p.y.toFixed(2)}   z ${p.z.toFixed(2)}`,
    `s ${s.toFixed(2)} m   t ${t.toFixed(2)} m`,
    `heading ${vec3(heading)}`,
  ];
  if (document.getElementById('normals').checked) {
    rows.push(`normal ${vec3(surfaceNormal(hit))}`);
  }
  rows.push(`section ${lane.section}   ${lane.direction}`, `laneId ${lane.laneId}`);

  tip.style.display = 'block';
  tip.style.left = (ev.clientX - rect.left + 14) + 'px';
  tip.style.top = (ev.clientY - rect.top + 14) + 'px';
  tip.innerHTML = rows.join('\n');
}

function vec3(v) {
  return `(${v[0].toFixed(3)}, ${v[1].toFixed(3)}, ${v[2].toFixed(3)})`;
}

// The baked surface normal at a hit, interpolated across the triangle from the
// three per-vertex normals rather than taken flat off the face. That is what
// `Mesh::height_at` reports, and it varies continuously instead of stepping at
// every facet edge.
function surfaceNormal(hit) {
  const g = roadMesh.geometry, pos = g.getAttribute('position'), nrm = g.getAttribute('normal');
  const f = hit.face;
  const a = new THREE.Vector3().fromBufferAttribute(pos, f.a);
  const b = new THREE.Vector3().fromBufferAttribute(pos, f.b);
  const c = new THREE.Vector3().fromBufferAttribute(pos, f.c);
  const bary = new THREE.Vector3();
  if (!THREE.Triangle.getBarycoord(hit.point, a, b, c, bary)) return [f.normal.x, f.normal.y, f.normal.z];
  const n = new THREE.Vector3();
  for (const [w, i] of [[bary.x, f.a], [bary.y, f.b], [bary.z, f.c]]) {
    n.addScaledVector(new THREE.Vector3().fromBufferAttribute(nrm, i), w);
  }
  n.normalize();
  return [n.x, n.y, n.z];
}

function hideTip() { tip.style.display = 'none'; }

// A picked triangle's face index maps to indices[faceIndex*3]; find the lane
// span whose index range contains it (binary search over sorted spans).
function laneForFace(faceIndex) {
  const idx = faceIndex * 3;
  let lo = 0, hi = spanIndex.length - 1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1, s = spanIndex[mid];
    if (idx < s.start) hi = mid - 1;
    else if (idx >= s.end) lo = mid + 1;
    else return s.lane;
  }
  return null;
}

// Signed lateral offset t, arc length s, and heading of `p` on a lane
// centerline, replicating Polyline::project: nearest segment by 3D distance, s
// summed in 3D, t measured in the ground plane, positive to the left of the
// segment. The heading is the exported per-vertex tangents interpolated the way
// Polyline::pose_at interpolates them, so it matches the crate at the ends,
// where the tangent is the curve's own rather than the last chord's.
function project(lane, p) {
  const pts = lane.centerline;
  let best = { d2: Infinity, s: 0, t: 0, heading: [0, 0, 0] };
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const ab = [b[0]-a[0], b[1]-a[1], b[2]-a[2]];
    const len2 = ab[0]*ab[0] + ab[1]*ab[1] + ab[2]*ab[2];
    const ap = [p.x-a[0], p.y-a[1], p.z-a[2]];
    let u = len2 > 1e-9 ? (ap[0]*ab[0]+ap[1]*ab[1]+ap[2]*ab[2]) / len2 : 0;
    u = Math.max(0, Math.min(1, u));
    const c = [a[0]+ab[0]*u, a[1]+ab[1]*u, a[2]+ab[2]*u];
    const d2 = (p.x-c[0])**2 + (p.y-c[1])**2 + (p.z-c[2])**2;
    if (d2 < best.d2) {
      const segLen = Math.sqrt(len2);
      // left normal of the horizontal heading: Z × (dx,dy,0) = (-dy, dx, 0).
      const hlen = Math.hypot(ab[0], ab[1]) || 1;
      const nx = -ab[1] / hlen, ny = ab[0] / hlen;
      const t = (p.x - c[0]) * nx + (p.y - c[1]) * ny;
      best = { d2, s: lane.cum[i] + segLen * u, t, heading: heading(lane, i, u) };
    }
  }
  return best;
}

// Unit heading a fraction `u` along segment `i`, lerped between the segment's
// two vertex tangents.
function heading(lane, i, u) {
  const a = lane.headings[i], b = lane.headings[i + 1];
  if (!a || !b) return [0, 0, 0];
  const h = [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u];
  const len = Math.hypot(h[0], h[1], h[2]) || 1;
  return [h[0] / len, h[1] / len, h[2] / len];
}

// --- Highlight ---------------------------------------------------------------

function setHighlight(lane) {
  highlight.geometry.setIndex(new THREE.Uint32BufferAttribute(lane.sliceIndices, 1));
  highlight.geometry.setDrawRange(0, lane.sliceIndices.length);
  highlight.visible = true;
  const flat = new Float32Array(lane.centerline.length * 3);
  lane.centerline.forEach((p, i) => { flat[i*3]=p[0]; flat[i*3+1]=p[1]; flat[i*3+2]=p[2]+0.05; });
  highlightLine.geometry.setAttribute('position', new THREE.Float32BufferAttribute(flat, 3));
  highlightLine.visible = true;
}

function clearHighlight() { highlight.visible = false; highlightLine.visible = false; }

function selectLane(id) {
  activeLane = (activeLane === id) ? null : id;
  if (activeLane == null) clearHighlight();
  else setHighlight(laneById.get(id));
  renderSidebar();
}

// --- Camera framing ----------------------------------------------------------

function frameOn(mesh) {
  const s = mesh.geometry.boundingSphere;
  const c = s.center, r = Math.max(s.radius, 5);
  controls.target.copy(c);
  camera.position.set(c.x, c.y - r * 1.2, c.z + r * 1.1);
  camera.near = r / 200; camera.far = r * 20; camera.updateProjectionMatrix();
  controls.update();
}

function frameOnLane(lane) {
  const pts = lane.centerline;
  const box = new THREE.Box3();
  for (const p of pts) box.expandByPoint(new THREE.Vector3(p[0], p[1], p[2]));
  const c = box.getCenter(new THREE.Vector3());
  const r = Math.max(box.getSize(new THREE.Vector3()).length() * 0.6, 8);
  controls.target.copy(c);
  camera.position.set(c.x, c.y - r, c.z + r);
  controls.update();
}

// --- Loop / util -------------------------------------------------------------

function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

function dist3(a, b) { return Math.hypot(a[0]-b[0], a[1]-b[1], a[2]-b[2]); }

function showError(e) {
  const el = document.getElementById('err');
  el.style.display = 'grid';
  el.innerHTML = `<div><p><strong>Viewer could not start.</strong></p><p>${e.message}</p></div>`;
  console.error(e);
}
</script>
